<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="icon" href="data:," />
    <title>TROY starter game</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: flex;
        min-height: 100vh;
        margin: 0;
        align-items: safe center;
        justify-content: center;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: none;
        padding:
          max(22px, env(safe-area-inset-top))
          18px
          max(22px, env(safe-area-inset-bottom));
        background:
          radial-gradient(circle at 50% 0%, #385f9d 0, transparent 42%),
          linear-gradient(160deg, #101d31, #060a12 72%);
        color: #f8fbff;
      }

      main {
        width: min(100%, 360px);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #86efcf;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 11vw, 3.2rem);
        line-height: 0.96;
        letter-spacing: -0.06em;
      }

      .status {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin: 20px 0;
      }

      .pill,
      .metric,
      .stage {
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(8, 15, 27, 0.68);
        box-shadow: 0 16px 50px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(12px);
      }

      .pill {
        overflow: hidden;
        border-radius: 999px;
        padding: 8px 10px;
        color: #c8d4e6;
        font-size: 0.7rem;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .stage {
        position: relative;
        height: 150px;
        overflow: hidden;
        border-radius: 24px;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      .track {
        position: absolute;
        right: 24px;
        bottom: 28px;
        left: 24px;
        height: 2px;
        background: rgba(255, 255, 255, 0.12);
      }

      .orb {
        position: absolute;
        bottom: 17px;
        left: 24px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: linear-gradient(145deg, #c4b5fd, #60a5fa);
        box-shadow: 0 0 28px rgba(96, 165, 250, 0.65);
        will-change: transform;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 10px;
      }

      .metric {
        border-radius: 18px;
        padding: 14px;
      }

      .metric span,
      .metric strong {
        display: block;
      }

      .metric span {
        color: #8fa0b8;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .metric strong {
        margin-top: 4px;
        font-size: 1.45rem;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 14px;
      }

      button {
        min-height: 50px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: white;
        cursor: pointer;
        font: inherit;
        font-size: 0.85rem;
        font-weight: 800;
        touch-action: manipulation;
      }

      button:first-child {
        border-color: transparent;
        background: #f8fbff;
        color: #07101f;
      }

      button:disabled {
        cursor: default;
        opacity: 0.48;
      }

      #quota-test,
      #restore-state,
      #bonus-load,
      #api-test {
        grid-column: 1 / -1;
      }

      .save-status {
        min-height: 1.5em;
        margin: 14px 4px 0;
        color: #9eacc0;
        font-size: 0.75rem;
        line-height: 1.5;
        text-align: center;
      }

      body[data-capture-splash="true"] .status,
      body[data-capture-splash="true"] .actions,
      body[data-capture-splash="true"] .save-status {
        display: none;
      }

      body[data-capture-splash="true"] .stage {
        height: 360px;
        margin-top: 28px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Runnable API starter</p>
      <h1>Keep the orb moving.</h1>

      <div class="status">
        <span class="pill" id="connection">Connecting…</span>
        <span class="pill" id="lifecycle">Waiting for lifecycle</span>
        <span class="pill" id="surface">surface unknown</span>
        <span class="pill" id="audio">audio not enabled</span>
      </div>

      <div class="stage" id="input-stage" tabindex="0" aria-label="Animation stage">
        <div class="track"></div>
        <div class="orb" id="orb"></div>
      </div>

      <p class="save-status" id="input-state">Held keys 0 / pointers 0</p>

      <div class="metrics">
        <div class="metric">
          <span>Saved score</span>
          <strong id="score">0</strong>
        </div>
        <div class="metric">
          <span>Animation frames</span>
          <strong id="frames">0</strong>
        </div>
      </div>

      <div class="actions">
        <button id="restore-state" type="button">Retry saved state</button>
        <button id="increment" type="button" disabled>Add score</button>
        <button id="sound" type="button" disabled>Enable sound</button>
        <button id="quota-test" type="button" disabled>Test the 64 KiB quota</button>
        <button id="api-test" type="button" disabled>Run all API checks</button>
        <button id="bonus-load" type="button" disabled>Load bonus content</button>
      </div>

      <p class="save-status" id="save-status">No saved state loaded.</p>
      <p class="save-status" id="bonus-status" role="status">Bonus content loads only when requested.</p>
    </main>
    <script type="module" src="./game.js"></script>
  </body>
</html>
